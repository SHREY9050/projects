server: { port: 8082 }
spring:
  application: { name: activity-service }
  config: { import: optional:configserver:http://localhost:8888 }
  data: { mongodb: { uri: mongodb://localhost:27017/fitflow_activities } }
  kafka: { bootstrap-servers: localhost:9092, producer: { key-serializer: org.apache.kafka.common.serialization.StringSerializer, value-serializer: org.springframework.kafka.support.serializer.JsonSerializer } }
  security: { oauth2: { resourceserver: { jwt: { issuer-uri: http://localhost:8180/realms/fitflow } } } }
eureka: { client: { service-url: { defaultZone: http://localhost:8761/eureka } } }

