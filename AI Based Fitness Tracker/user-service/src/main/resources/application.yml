server: { port: 8081 }
spring:
  application: { name: user-service }
  config: { import: optional:configserver:http://localhost:8888 }
  datasource: { url: jdbc:postgresql://localhost:5432/fitflow, username: fitflow, password: fitflow }
  jpa: { hibernate: { ddl-auto: update }, open-in-view: false }
  security: { oauth2: { resourceserver: { jwt: { issuer-uri: http://localhost:8180/realms/fitflow } } } }
eureka: { client: { service-url: { defaultZone: http://localhost:8761/eureka } } }

