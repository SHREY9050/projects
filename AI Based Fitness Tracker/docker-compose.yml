services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: fitflow, POSTGRES_USER: fitflow, POSTGRES_PASSWORD: fitflow }
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  kafka:
    image: apache/kafka:3.7.2
    ports: ["9092:9092"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment: { KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin }
    ports: ["8180:8080"]
    volumes: ["./infrastructure/keycloak/fitflow-realm.json:/opt/keycloak/data/import/fitflow-realm.json:ro"]
volumes: { postgres-data: {}, mongo-data: {} }

